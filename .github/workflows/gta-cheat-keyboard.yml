name: Build GTA Cheat Keyboard APK

on:
  push:
    paths:
      - 'gta-cheat-keyboard/**'
      - '.github/workflows/gta-cheat-keyboard.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gta-cheat-keyboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../gta-cheat-keyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gta-cheat-keyboard-apk
          path: gta-cheat-keyboard.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gta-cheat-keyboard-latest
          name: GTA SA Cheat Keyboard (latest build)
          target_commitish: ${{ github.sha }}
          body: |
            Latest APK built from `${{ github.ref_name }}` @ ${{ github.sha }}.
            Download `gta-cheat-keyboard.apk`, install it, then open the app and follow the setup steps.
          files: gta-cheat-keyboard.apk
          make_latest: false
