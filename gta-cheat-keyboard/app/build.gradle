plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sheshnath.gtacheatkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sheshnath.gtacheatkeyboard'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly (sideload).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Shizuku lets the app inject key presses into the game without root.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
